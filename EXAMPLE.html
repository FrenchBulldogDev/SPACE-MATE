<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Spacy</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f9; }
    
    /* Contenedor del Chat */
    #chat-widget {
      position: fixed; bottom: 20px; right: 20px;
      width: 340px; background: white; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15); overflow: hidden;
      display: flex; flex-direction: column;
    }
    #chat-header {
      background: #2563eb; color: white; padding: 14px;
      font-weight: bold; display: flex; justify-content: space-between;
    }
    #chat-messages {
      height: 300px; padding: 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg { padding: 10px 14px; border-radius: 10px; max-width: 80%; font-size: 14px; line-height: 1.4; }
    .bot { background: #e5e7eb; color: #1f2937; align-self: flex-start; }
    .user { background: #2563eb; color: white; align-self: flex-end; }
    
    /* Botones sugeridos */
    #quick-replies {
      padding: 8px 14px; display: flex; gap: 6px; flex-wrap: wrap;
      border-top: 1px solid #eee; background: #fafafa;
    }
    .chip {
      background: #dbeafe; color: #1e40af; border: none;
      padding: 5px 10px; border-radius: 15px; font-size: 12px;
      cursor: pointer; transition: 0.2s;
    }
    .chip:hover { background: #bfdbfe; }

    /* Input */
    #chat-input-area { display: flex; border-top: 1px solid #ddd; }
    #user-input {
      flex: 1; border: none; padding: 12px; outline: none; font-size: 14px;
    }
    #send-btn {
      background: #2563eb; color: white; border: none;
      padding: 0 16px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>

<div id="chat-widget">
  <div id="chat-header">Asistente Virtual</div>
  <div id="chat-messages">
    <div class="msg bot">¡Hola! Soy Spacy, tu asistente local. ¿En qué te puedo ayudar hoy?</div>
  </div>
  <div id="quick-replies"></div>
  <form id="chat-input-area">
    <input type="text" id="user-input" placeholder="Escribe tu duda..." autocomplete="off">
    <button type="submit" id="send-btn">Enviar</button>
  </form>
</div>

<script>
  // 1. BASE DE CONOCIMIENTO LOCAL
  const baseConocimiento = [
    {
      pregunta: "¿Cómo se usa?",
      keywords: ["uso", "como"],
      respuesta: "1.	Para iniciar podes elegir un modo de visualización entre escala física y público general, 2.Selecciona el sitio de lanzamiento de tu preferencia 3.	Elegi la fecha en la que prefieras hacer el viaje dentro de las opciones indicadas 4. Espera y disfruta una trivia mientras hacemos las cuentas 4. Elegi la mejor opcion para realizar el aterrizaje
"
    },
    {
      pregunta: "¿Qué significan los colores sobre la luna?",
      keywords: ["amarillo", "verde", "rojo", "efectivo"],
      respuesta: "verde es buena comunicacion, amarillo moderada, rojo no recomendado."
    },
    {
      pregunta: "¿para que sirve el modo publico especializado?",
      keywords: [especializado, modo, publico],
      respuesta: "El modo especializado es con fines cientificos, para su operacion requerira completar algunos datos adicionales."
    },
    {
      pregunta: "¿Como es la estructura del Json cientifico?",
      keywords: ["estructura","json"],
      respuesta: "Cliqueá en descargar especificacion de entrada."
    }
  ];

  const messagesDiv = document.getElementById('chat-messages');
  const quickRepliesDiv = document.getElementById('quick-replies');
  const chatForm = document.getElementById('chat-input-area');
  const userInput = document.getElementById('user-input');

  // 2. NORMALIZAR TEXTO (Quita tildes y pasa a minúsculas)
  function normalizar(texto) {
    return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }

  // 3. MOTOR DE BÚSQUEDA POR COINCIDENCIA
  function buscarRespuesta(inputUsuario) {
    const textoLimpio = normalizar(inputUsuario);
    const palabrasUsuario = textoLimpio.split(/\W+/);
    
    let mejorCoincidencia = null;
    let maxPuntos = 0;

    baseConocimiento.forEach(item => {
      let puntos = 0;
      item.keywords.forEach(kw => {
        if (palabrasUsuario.includes(normalizar(kw))) {
          puntos += 2; // Coincidencia exacta de palabra clave
        } else if (textoLimpio.includes(normalizar(kw))) {
          puntos += 1; // Coincidencia parcial
        }
      });

      if (puntos > maxPuntos) {
        maxPuntos = puntos;
        mejorCoincidencia = item;
      }
    });

    if (maxPuntos > 0) {
      return mejorCoincidencia.respuesta;
    } else {
      return "No estoy seguro de entender tu consulta. Prueba seleccionando una de las opciones sugeridas arriba o reformula tu pregunta.";
    }
  }

  // 4. INTERFAZ Y RENDERIZADO
  function agregarMensaje(texto, remitente) {
    const div = document.createElement('div');
    div.classList.add('msg', remitente);
    div.textContent = texto;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function procesarConsulta(texto) {
    if (!texto.trim()) return;
    agregarMensaje(texto, 'user');
    
    // Simular pequeño tiempo de escritura para mayor naturalidad
    setTimeout(() => {
      const respuesta = buscarRespuesta(texto);
      agregarMensaje(respuesta, 'bot');
    }, 350);
  }

  // Cargar botones de preguntas rápidas
  baseConocimiento.forEach(item => {
    const btn = document.createElement('button');
    btn.classList.add('chip');
    btn.textContent = item.pregunta;
    btn.onclick = () => procesarConsulta(item.pregunta);
    quickRepliesDiv.appendChild(btn);
  });

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    procesarConsulta(userInput.value);
    userInput.value = '';
  });
</script>

</body>
</html>
